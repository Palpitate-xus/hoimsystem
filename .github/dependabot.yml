version: 2
updates:
  - package-ecosystem: pip
    directory: /fastapi_be
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      python-patches:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /vue3-new-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      frontend-patches:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directories: ["/", "/fastapi_be", "/vue3-new-ui", "/deploy/preview", "/fastapi_benchmark"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      container-images:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      workflow-actions:
        patterns: ["*"]
