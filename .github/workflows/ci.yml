name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fastapi_be
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi_be/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.16.5 pip-audit==2.10.0 locust==2.46.4
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Lint and compile
        run: |
          ruff check app tests
          python -m compileall -q app tests
      - name: Test backend
        run: pytest -q
      - name: Test benchmark safety
        working-directory: .
        env:
          PYTHONPATH: fastapi_be
        run: pytest -q fastapi_benchmark/tests
      - name: Validate Compose
        working-directory: .
        env:
          POSTGRES_PASSWORD: ci-database-password
          SECRET_KEY: ci-secret-key-long-enough-for-validation
          ALLOWED_ORIGINS: https://ci.example.com
        run: docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vue3-new-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vue3-new-ui/package-lock.json
      - run: npm ci
      - run: npm run audit
      - run: npm run build
      - run: npm run check:bundle
