services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: hoimsystem_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hoimsystem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: hoimsystem
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 数据库不对外暴露端口：仅容器网络内访问，减少攻击面
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoimsystem -d hoimsystem"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./fastapi_be
    container_name: hoimsystem_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://hoimsystem:${POSTGRES_PASSWORD}@db:5432/hoimsystem
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set before starting production compose}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set (no wildcards)}
      # 外部系统集成密钥（LIS/PACS/医保/支付回调），未配置时对应回调返回 503
      LIS_INTEGRATION_KEY: ${LIS_INTEGRATION_KEY:-}
      PACS_INTEGRATION_KEY: ${PACS_INTEGRATION_KEY:-}
      MEDICAL_INSURANCE_INTEGRATION_KEY: ${MEDICAL_INSURANCE_INTEGRATION_KEY:-}
      PAYMENT_INTEGRATION_KEY: ${PAYMENT_INTEGRATION_KEY:-}
      AUTO_CREATE_SCHEMA: "false"
      SCHEDULER_ENABLED: "false"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      REDIS_URL: redis://redis:6379/0
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    volumes:
      - ./fastapi_be/app/uploads:/app/app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    build: ./fastapi_be
    restart: "no"
    command: ["python", "-m", "app.db_migrate"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://hoimsystem:${POSTGRES_PASSWORD}@db:5432/hoimsystem
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set before starting production compose}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set (no wildcards)}
      AUTO_CREATE_SCHEMA: "false"
      SCHEDULER_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: ./fastapi_be
    container_name: hoimsystem_scheduler
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler_runner"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://hoimsystem:${POSTGRES_PASSWORD}@db:5432/hoimsystem
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set before starting production compose}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set (no wildcards)}
      AUTO_CREATE_SCHEMA: "false"
      SCHEDULER_ENABLED: "true"
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-3600}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./vue3-new-ui
    container_name: hoimsystem_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
