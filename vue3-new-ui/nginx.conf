server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ===== 安全响应头 =====
    # 生产环境建议在 server 块外配置 HTTPS(443) 并由 80 强制跳转
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP：允许同源资源 + Element Plus/字体样式；api 为同源反代，无需额外 connect-src
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # 隐藏 nginx 版本号
    server_tokens off;

    # 前端路由支持（Vue Router hash 模式无需额外配置）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location ^~ /api/ {
        # 不使用尾部斜杠，保留后端路由所需的 /api 前缀
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 请求体上限（与后端上传限制对齐，防止超大请求打爆后端）
        client_max_body_size 25m;
        proxy_read_timeout 60s;
    }

    # 临床事件使用长连接响应，必须关闭代理缓冲。
    # accesstoken 通过请求头传输，不出现在 URL 或访问日志中。
    location /api/events/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
